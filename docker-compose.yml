services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalora-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    ports:
      - "4000:4000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Optional Caddy reverse proxy for automated HTTPS / Let's Encrypt SSL
  # Uncomment if using on your Oracle VM with ports 80/443 exposed
