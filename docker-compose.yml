services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evalora-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-evalora_redis_secret}@redis:6379
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: evalora-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-evalora_redis_secret}
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      # Bound to localhost so it is not exposed publicly on your Oracle VM
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-evalora_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Caddy reverse proxy for automated HTTPS / Let's Encrypt SSL
  # Uncomment if using on your Oracle VM with ports 80/443 exposed
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: evalora-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - backend

volumes:
  redis_data:
#   caddy_data:
#   caddy_config:
